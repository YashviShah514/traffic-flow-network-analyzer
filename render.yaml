# Render blueprint: FastAPI backend + managed PostgreSQL. The frontend is deployed separately on Vercel.
databases:
  - name: traffic-db
    plan: free

services:
  - type: web
    name: traffic-flow-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: traffic-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://your-app.vercel.app   # replace with your Vercel URL
